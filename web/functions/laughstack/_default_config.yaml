# LaughStack default configuration.
# Copy per-engagement and override; never edit defaults for one client.

ingest:
  target_sample_rate: 16000       # analysis rate; kit masters stay at 48k
  expect_cal_tone: true           # false for youtube/upload sources
  cal_tone_hz: 1000.0
  qc:
    max_clipping_ratio: 1.0e-4
    dropout_min_s: 0.2
    max_noise_floor_dbfs: -45.0

detect:
  backend: heuristic              # heuristic | yamnet | sensevoice | whisper-at
  win_s: 1.0
  hop_s: 0.25
  on_threshold: 0.5
  off_threshold: 0.3
  min_event_s: 0.4
  merge_gap_s: 0.4

align:
  stack_window_s: 1.5             # tag landing within this of a laugh's end = stacked
  max_latency_s: 3.0              # punchline-to-laugh beyond this = unaligned

transcribe:
  enabled: false                  # requires faster-whisper ([asr] extra)
  model_size: small
  language: en

metrics:
  # median/MAD normalization is not configurable on purpose.
  par_headliner_benchmark: 30.0   # Comedy Evaluator Pro: 18 s/min laughter

compare:
  min_similarity: 0.5             # Jaccard on content tokens

clips:
  max_clips: 5
  min_duration_s: 8.0
  max_duration_s: 90.0

youtube:
  out_dir: data/youtube
  sample_rate: 16000
